name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18:00 更新
  workflow_dispatch:

# 默认只读；只有 build job 提权为可写
permissions:
  contents: read

jobs:
  # 隔离 job：在这里用 npm install 构建第三方工具。
  # 只拿默认的只读 GITHUB_TOKEN，不接触 PAT，也不能写仓库。
  activity-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true # 失败也不影响 3D 图的更新
    env:
      GRAPH_REF: 0962e9461de815933d462e8b98c7ce566cada8fb # Ashutosh00710/github-readme-activity-graph, pinned
    steps:
      - name: Build activity graph tool
        run: |
          git clone -q https://github.com/Ashutosh00710/github-readme-activity-graph.git /tmp/ag
          git -C /tmp/ag checkout -q "$GRAPH_REF"
          cd /tmp/ag
          # 上游 lock 文件与 package.json 不同步，npm ci 会失败；--ignore-scripts 禁止依赖的安装脚本
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Render SVG
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd /tmp/ag && PORT=5100 node dist/main.js > /tmp/ag.log 2>&1 &)
          for i in $(seq 30); do curl -s -o /dev/null localhost:5100 && break; sleep 1; done
          mkdir -p out
          curl -sS --fail-with-body -o out/graph.svg \
            "http://localhost:5100/graph?username=${{ github.repository_owner }}&bg_color=ffffff&color=40c463&title_color=40c463&line=40c463&point=f9a825&area=true&area_color=9be9a8&hide_border=true" \
            || { cat /tmp/ag.log; exit 1; }
          grep -q '<svg' out/graph.svg
      - uses: actions/upload-artifact@v4
        with:
          name: activity-graph
          path: out/graph.svg
          retention-days: 1

  build:
    needs: activity-graph
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # 设置了 PAT secret 时会统计私有仓库贡献；没设置时退回默认 token（只统计公开贡献）
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: activity-graph
          path: profile-activity-graph
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update contribution graphs" || exit 0
          git push
