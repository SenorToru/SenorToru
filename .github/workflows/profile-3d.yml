name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18:00 更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # 设置了 PAT secret 时会统计私有仓库贡献；没设置时退回默认 token（只统计公开贡献）
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate activity graph
        env:
          TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GRAPH_REF: 0962e9461de815933d462e8b98c7ce566cada8fb # Ashutosh00710/github-readme-activity-graph, pinned
        run: |
          set -x
          git clone -q https://github.com/Ashutosh00710/github-readme-activity-graph.git /tmp/ag
          git -C /tmp/ag checkout -q "$GRAPH_REF"
          (cd /tmp/ag && npm ci && npm run build)
          (cd /tmp/ag && PORT=5100 node dist/main.js > /tmp/ag.log 2>&1 &)
          for i in $(seq 30); do curl -sf -o /dev/null localhost:5100 && break; sleep 1; done
          mkdir -p profile-activity-graph
          curl -sS --fail-with-body -o profile-activity-graph/graph.svg \
            "http://localhost:5100/graph?username=${{ github.repository_owner }}&bg_color=ffffff&color=40c463&title_color=40c463&line=40c463&point=f9a825&area=true&area_color=9be9a8&hide_border=true"
          grep -q '<svg' profile-activity-graph/graph.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3D contribution graph" || exit 0
          git push
